# ~/.tmux.conf — modern tmux 3.x configuration for dots
# Baseline: tmux >= 3.2 (no <2.x compatibility branches)
# Prefix: Ctrl-Space  |  Herdr uses Ctrl-A separately

# Terminal / truecolor {{{1
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -ga terminal-overrides ",*256col*:Tc"
set -as terminal-features ",*256col*:RGB"
# 1}}}

# General {{{1
set -g mouse on
set -g set-titles on
set -g set-titles-string "#S:#I:#W — #T"
set -s escape-time 10
set -sg repeat-time 600
set -s focus-events on
set -g history-limit 50000
set -g display-time 4000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
setw -g mode-keys vi
set -g status-interval 5
set -g status-position bottom
# 1}}}

# Clipboard (OSC 52 + yank plugin) {{{1
set -s set-clipboard on
# 1}}}

# Prefix {{{1
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
# 1}}}

# Splits / panes (preserve muscle memory) {{{1
bind v split-window -h -c "#{pane_current_path}"
bind b split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# 1}}}

# Safer kill bindings (no accidental kill-server) {{{1
bind x confirm-before -p "Kill pane? (y/n)" kill-pane
bind K confirm-before -p "Kill window? (y/n)" kill-window
# 1}}}

# Reload {{{1
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
# 1}}}

# Helpers {{{1
bind / command-prompt "split-window -h 'exec man %%'"
bind '~' split-window -v "exec bash -lc 'command -v btop >/dev/null && exec btop; command -v htop >/dev/null && exec htop; exec top'"
# 1}}}

# Copy mode (vi) {{{1
bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
# 1}}}

# Plugins (pinned Catppuccin release) {{{1
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_status_modules_right "directory session date_time"
set -g @catppuccin_status_modules_left ""
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_date_time_text "%a %d %b %H:%M"

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set -g @yank_selection_mouse 'clipboard'
# 1}}}

# TPM bootstrap {{{1
if-shell 'test -x /opt/homebrew/opt/tpm/share/tpm/tpm' {
  run-shell '/opt/homebrew/opt/tpm/share/tpm/tpm'
} {
  if-shell 'test -x /usr/local/opt/tpm/share/tpm/tpm' {
    run-shell '/usr/local/opt/tpm/share/tpm/tpm'
  } {
    run-shell '~/.tmux/plugins/tpm/tpm'
  }
}
# 1}}}
