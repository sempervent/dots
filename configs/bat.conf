# Bat configuration — Catppuccin Mocha when theme is installed
# Theme files live under configs/bat/themes/ and are linked by setup.sh

--theme="Catppuccin Mocha"
--style="numbers,changes,header"
--pager="less -FR"
--tabs=2
--wrap=auto
--italic-text=always
--map-syntax "*.conf:INI"
--map-syntax "*.config:INI"
--map-syntax ".env*:INI"
--map-syntax "*.hcl:HCL"
--map-syntax "*.tf:Terraform"
