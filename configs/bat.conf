# Bat configuration file
# Location: ~/.config/bat/config or symlinked from dots/configs/bat.conf

# Theme
--theme="Monokai Extended"

# Syntax highlighting
--style="numbers,changes,header"

# Show line numbers
--number

# Always show line numbers (don't hide in piping mode)
--pager="less -FR"

# Tab width
--tabs=2

# Wrap lines
--wrap=auto

# Highlight non-printable characters
--show-all

# Use italics
--italic-text=always

# Map file extensions
--map-syntax "*.conf:INI"
--map-syntax "*.config:INI"
--map-syntax ".env*:INI"
--map-syntax "*.hocon:JSON"
--map-syntax "*.hcl:HCL"
--map-syntax "*.tf:Terraform"

# Color scheme for dark backgrounds
--color=always


