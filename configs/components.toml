# configs/components.toml — authoritative optional-component registry
#
# Single source for setup.sh / bootstrap.sh / configure.sh / profile `all`.
# Profiles and CLI --with must only reference ids listed here (or supergroups).
#
# Optional brewfile = path relative to repo root (Homebrew fragment for --with).
# See docs/EXTENDING.md and docs/ARCHITECTURE.md.

version = 1

[[components]]
id = "herdr"
label = "Herdr"
category = "multiplexer"
cloud = false
local_ai = false
platforms = ["darwin", "linux"]
brewfile = "brew/Brewfile.herdr"
description = "Terminal multiplexer (Brewfile.herdr)"

[[components]]
id = "hermes"
label = "Hermes"
category = "ai_client"
cloud = false
local_ai = true
platforms = ["darwin", "linux"]
brewfile = "brew/Brewfile.hermes"
description = "Hermes agent CLI (+ macOS hermes-desktop)"

[[components]]
id = "ollama"
label = "Ollama"
category = "ai_runtime"
cloud = false
local_ai = true
platforms = ["darwin", "linux"]
brewfile = "brew/Brewfile.ollama"
description = "Local LLM runtime (no models pulled)"

[[components]]
id = "llamacpp"
label = "llama.cpp"
category = "ai_runtime"
cloud = false
local_ai = true
platforms = ["darwin", "linux"]
brewfile = "brew/Brewfile.llamacpp"
description = "llama.cpp runtime (Homebrew; models via pull_models.sh)"

[[components]]
id = "archify"
label = "Archify"
category = "skills"
cloud = false
local_ai = false
omit_from_all = true
platforms = ["darwin", "linux"]
brewfile = "brew/Brewfile.archify"
description = "Archify skill only (also included in --with skills)"

[[components]]
id = "skills"
label = "Engineering skills"
category = "skills"
cloud = false
local_ai = false
platforms = ["darwin", "linux"]
brewfile = "brew/Brewfile.archify"
description = "Curated engineering skill pack (includes Archify)"

[[components]]
id = "ai-skills"
label = "AI skills"
category = "skills"
cloud = false
local_ai = false
platforms = ["darwin", "linux"]
brewfile = "brew/Brewfile.archify"
description = "Curated AI/agent engineering skill pack"

[[components]]
id = "drawthings"
label = "Draw Things"
category = "image_ai"
cloud = false
local_ai = true
platforms = ["darwin", "linux"]
brewfile = "brew/Brewfile.drawthings"
description = "Draw Things CLI + MCP bridge + img (GUI/models are macOS-oriented)"

[[components]]
id = "opencode"
label = "OpenCode"
category = "ai_client"
cloud = false
local_ai = true
platforms = ["darwin", "linux"]
brewfile = "brew/Brewfile.opencode"
description = "Local/general coding adapter"

[[components]]
id = "codex"
label = "Codex"
category = "ai_client"
cloud = true
local_ai = false
platforms = ["darwin"]
brewfile = "brew/Brewfile.codex"
description = "Frontier coding via Homebrew cask Codex"

[[components]]
id = "cursor"
label = "Cursor"
category = "ai_client"
cloud = true
local_ai = false
platforms = ["darwin"]
brewfile = "brew/Brewfile.cursor"
description = "Cursor Agent CLI (explicit opt-in)"

[[components]]
id = "fluidvoice"
label = "FluidVoice"
category = "voice_ai"
cloud = false
local_ai = true
platforms = ["darwin"]
min_darwin = "15"
brewfile = "brew/Brewfile.fluidvoice"
description = "Local voice-to-text dictation app with optional AI enhancement"

[[components]]
id = "images"
label = "Images toolkit"
category = "media"
cloud = false
local_ai = false
platforms = ["darwin", "linux"]
brewfile = "brew/Brewfile.images"
description = "Deterministic image toolkit (Magick, etc.)"

[[components]]
id = "tex"
label = "TeX"
category = "docs"
cloud = false
local_ai = false
platforms = ["darwin", "linux"]
brewfile = "brew/Brewfile.tex"
description = "Homebrew TeX Live (CLI)"

[[components]]
id = "mactools"
label = "macOS tools"
category = "workstation"
cloud = false
local_ai = false
omit_from_all = true
platforms = ["darwin"]
brewfile = "brew/Brewfile.mactools"
description = "Optional macOS workstation layer (Vorssaint + automation/audio/CLI; Brewfile.mactools)"

[[components]]
id = "lsp"
label = "Language servers"
category = "developer_tooling"
cloud = false
local_ai = false
platforms = ["darwin", "linux"]
brewfile = "brew/Brewfile.lsp"
description = "Language servers for DOTS development/editor workflows"

[[components]]
id = "ai-server"
label = "AI inference server"
category = "ai_runtime"
cloud = false
local_ai = true
omit_from_all = true
platforms = ["darwin", "linux"]
brewfile = "brew/Brewfile.ai-server"
description = "Server stack: llama.cpp (llama-server) + Open WebUI via Docker Compose (opt-in models)"

# Declarative selector aggregates. Expand to member component ids before install.
# Nested groups are not supported in v1.0.1.
[[supergroups]]
id = "ai"
label = "AI applications"
description = "Local runtimes, coding agents, and the LSP toolchain for this platform"
members = [
  "hermes",
  "ollama",
  "llamacpp",
  "drawthings",
  "opencode",
  "codex",
  "cursor",
  "fluidvoice",
  "lsp",
]
