# configs/components.toml — authoritative optional-component registry
#
# Single source for setup.sh / bootstrap.sh / configure.sh / profile `all`.
# Profiles and CLI --with must only reference ids listed here (or supergroups).

version = 1

[[components]]
id = "herdr"
label = "Herdr"
category = "multiplexer"
cloud = false
local_ai = false
platforms = ["darwin", "linux"]
description = "Terminal multiplexer (Brewfile.herdr)"

[[components]]
id = "hermes"
label = "Hermes"
category = "ai_client"
cloud = false
local_ai = true
platforms = ["darwin", "linux"]
description = "Hermes agent CLI (+ macOS hermes-desktop)"

[[components]]
id = "ollama"
label = "Ollama"
category = "ai_runtime"
cloud = false
local_ai = true
platforms = ["darwin", "linux"]
description = "Local LLM runtime (no models pulled)"

[[components]]
id = "llamacpp"
label = "llama.cpp"
category = "ai_runtime"
cloud = false
local_ai = true
platforms = ["darwin", "linux"]
description = "llama.cpp runtime (Homebrew; models via pull_models.sh)"

[[components]]
id = "archify"
label = "Archify"
category = "skills"
cloud = false
local_ai = false
omit_from_all = true
platforms = ["darwin", "linux"]
description = "Archify skill only (also included in --with skills)"

[[components]]
id = "skills"
label = "Engineering skills"
category = "skills"
cloud = false
local_ai = false
platforms = ["darwin", "linux"]
description = "Curated engineering skill pack (includes Archify)"

[[components]]
id = "ai-skills"
label = "AI skills"
category = "skills"
cloud = false
local_ai = false
platforms = ["darwin", "linux"]
description = "Curated AI/agent engineering skill pack"

[[components]]
id = "drawthings"
label = "Draw Things"
category = "image_ai"
cloud = false
local_ai = true
platforms = ["darwin", "linux"]
description = "Draw Things CLI + MCP bridge + img (GUI/models are macOS-oriented)"

[[components]]
id = "opencode"
label = "OpenCode"
category = "ai_client"
cloud = false
local_ai = true
platforms = ["darwin", "linux"]
description = "Local/general coding adapter"

[[components]]
id = "codex"
label = "Codex"
category = "ai_client"
cloud = true
local_ai = false
platforms = ["darwin"]
description = "Frontier coding via Homebrew cask Codex"

[[components]]
id = "cursor"
label = "Cursor"
category = "ai_client"
cloud = true
local_ai = false
platforms = ["darwin"]
description = "Cursor Agent CLI (explicit opt-in)"

[[components]]
id = "fluidvoice"
label = "FluidVoice"
category = "voice_ai"
cloud = false
local_ai = true
platforms = ["darwin"]
min_darwin = "15"
description = "Local voice-to-text dictation app with optional AI enhancement"

[[components]]
id = "images"
label = "Images toolkit"
category = "media"
cloud = false
local_ai = false
platforms = ["darwin", "linux"]
description = "Deterministic image toolkit (Magick, etc.)"

[[components]]
id = "tex"
label = "TeX"
category = "docs"
cloud = false
local_ai = false
platforms = ["darwin", "linux"]
description = "Homebrew TeX Live (CLI)"

# Declarative selector aggregates. Expand to member component ids before install.
# Nested groups are not supported in v1.0.1.
[[supergroups]]
id = "ai"
label = "AI applications"
description = "All supported AI applications for this platform"
members = [
  "hermes",
  "ollama",
  "llamacpp",
  "drawthings",
  "opencode",
  "codex",
  "cursor",
  "fluidvoice",
]
