[[components]]
id = "codex"
label = "Codex"
category = "ai_client"
cloud = true
local_ai = false
platforms = ["darwin"]
brewfile = "brew/Brewfile.codex"
description = "Frontier coding via Homebrew cask Codex"

[[components]]
id = "cursor"
label = "Cursor"
category = "ai_client"
cloud = true
local_ai = false
platforms = ["darwin"]
brewfile = "brew/Brewfile.cursor"
description = "Cursor Agent CLI (explicit opt-in)"

[[components]]
id = "fluidvoice"
