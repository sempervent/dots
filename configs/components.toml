[[components]]
id = "images"
label = "Images toolkit"
category = "media"
cloud = false
local_ai = false
platforms = ["darwin", "linux"]
brewfile = "brew/Brewfile.images"
description = "Deterministic image toolkit (Magick, etc.)"

[[components]]
id = "tex"
label = "TeX"
category = "docs"
cloud = false
local_ai = false
platforms = ["darwin", "linux"]
brewfile = "brew/Brewfile.tex"
description = "Homebrew TeX Live (CLI)"

[[components]]
id = "mactools"
label = "macOS tools"
category = "workstation"
cloud = false
local_ai = false
omit_from_all = true
allow_leaf_packages = true
platforms = ["darwin"]
brewfile = "brew/Brewfile.mactools"
description = "Optional macOS workstation layer (Vorssaint, f.lux, automation/GUI apps; Brewfile.mactools)"

[[components]]
id = "karabiner-elements"
label = "Karabiner-Elements"
category = "workstation"
cloud = false
local_ai = false
omit_from_all = true
platforms = ["darwin"]
brewfile = "brew/Brewfile.karabiner-elements"
description = "Optional keyboard remapper (install-only; no mappings, no TCC/system-extension approval)"

[[components]]
id = "orbstack"
label = "OrbStack"
category = "containers"
cloud = false
local_ai = false
omit_from_all = true
platforms = ["darwin"]
brewfile = "brew/Brewfile.orbstack"
description = "Optional Darwin Docker-compatible runtime (install-only; never auto-start or remove Docker Desktop)"

[[components]]
id = "davinci-resolve"
label = "DaVinci Resolve"
category = "media"
cloud = false
local_ai = false
omit_from_all = true
platforms = ["darwin"]
brewfile = "brew/Brewfile.davinci-resolve"
helper = "helpers/davinci_resolve.sh"
helper_packages = ["davinci-resolve"]
description = "Optional professional NLE via Mac App Store (mas; install-only; never launch, scan media, or require App Store auth globally)"

[[components]]
id = "mitmproxy"
label = "mitmproxy"
category = "network"
cloud = false
local_ai = false
omit_from_all = true
platforms = ["darwin"]
brewfile = "brew/Brewfile.mitmproxy"
description = "Opt-in HTTP interception CLIs (install-only; never start proxy, trust CA, or change system proxy)"

[[components]]
id = "syncthing"
label = "Syncthing"
category = "backup"
cloud = false
local_ai = false
omit_from_all = true
platforms = ["darwin", "linux"]
brewfile = "brew/Brewfile.syncthing"
description = "Opt-in peer sync client (install-only; never start daemon, pair devices, or create folders)"

[[components]]
id = "lsp"
label = "Language servers"
category = "developer_tooling"
cloud = false
local_ai = false
platforms = ["darwin", "linux"]
brewfile = "brew/Brewfile.lsp"
description = "Language servers for DOTS development/editor workflows"

[[components]]
id = "ai-server"
label = "AI inference server"
category = "ai_runtime"
cloud = false
local_ai = true
omit_from_all = true
platforms = ["darwin", "linux"]
brewfile = "brew/Brewfile.ai-server"
description = "Server stack: llama.cpp (llama-server) + Open WebUI via Docker Compose (opt-in models)"

[[components]]
id = "pi"
label = "Pi Coding Agent"
category = "ai_client"
cloud = false
local_ai = true
platforms = ["darwin", "linux"]
brewfile = "brew/Brewfile.pi"
helper = "helpers/pi.sh"
helper_packages = ["@earendil-works/pi-coding-agent"]
description = "Programmable coding-agent runtime for DOTS local-first agent orchestration (npm; Node ≥22.19)"

[[components]]
id = "litellm"
label = "LiteLLM Gateway"
category = "ai_gateway"
cloud = false
local_ai = true
platforms = ["darwin", "linux"]
brewfile = "brew/Brewfile.litellm"
description = "Unified model gateway for local and remote agent inference (localhost Compose; OpenRouter via env)"

[[components]]
id = "agent-sandbox"
label = "Agent Sandbox"
category = "agent_security"
cloud = false
local_ai = false
platforms = ["darwin", "linux"]
brewfile = "brew/Brewfile.agent-sandbox"
helper = "helpers/agent_sandbox.sh"
helper_packages = ["pi-sandbox"]
linux_packages = ["bubblewrap", "socat"]
description = "Filesystem/network policy and OS-level command sandbox for DOTS agents (provider: pi-sandbox)"

[[components]]
id = "openrig"
label = "OpenRig"
category = "agent_orchestration"
cloud = false
local_ai = true
platforms = ["darwin", "linux"]
brewfile = "brew/Brewfile.openrig"
helper = "helpers/openrig.sh"
helper_packages = ["@openrig/cli"]
description = "Persistent multi-agent orchestration for Pi, Codex and other coding runtimes (npm @openrig/cli; Node ≥22)"

# Declarative selector aggregates. Expand to member component ids before install.
# Nested groups are not supported in v1.0.1.
[[supergroups]]
id = "ai"
label = "AI applications"
description = "Local runtimes, coding agents, and the LSP toolchain for this platform"
members = [
  "hermes",
  "ollama",
  "llamacpp",
  "drawthings",
  "opencode",
  "codex",
  "cursor",
  "fluidvoice",
  "lsp",
  "pi",
  "litellm",
  "agent-sandbox",
  "openrig",
]
