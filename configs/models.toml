# configs/models.toml — authoritative DOTS local-model registry
#
# Upstream interfaces verified for v1.1.0 (do not invent alternatives):
#   Ollama:     https://docs.ollama.com/cli  — `ollama pull`, `ollama ls`
#   llama.cpp:  https://github.com/ggml-org/llama.cpp + Homebrew formula
#               — `llama-cli -hf <repo>[:quant]`, `llama-cli --cache-list`
#   Draw Things: draw-things-cli --help (community CLI)
#               — `models list [--downloaded-only]`, `models ensure --model`
#   FluidVoice: https://github.com/altic-dev/FluidVoice / https://altic.dev/fluid
#               — speech/Fluid-1 models via app onboarding UI only (no stable CLI)
#
# Policy: Ollama owns "general"; llama.cpp owns "coding" in auto mode so the
# same weights are not double-downloaded into both caches. Explicit
# --provider all may still pull both stacks when the user asks.

version = 1

[policy]
reserve_memory_gb = 4
reserve_disk_gb = 20
# Tier by total installed RAM (GB), not usable RAM.
# 8–15 → minimal, 16–31 → balanced, 32–63 → large, 64+ → max
tier_minimal_max_ram_gb = 15
tier_balanced_max_ram_gb = 31
tier_large_max_ram_gb = 63
# Auto-mode preferred LLM runtime when both ollama + llamacpp are present
preferred_general_provider = "ollama"
preferred_coding_provider = "llamacpp"
# Fluid-1 cleanup is opt-in (not required for dictation)
include_cleanup_by_default = false

# --- Ollama (general chat) ---------------------------------------------------

[[models]]
id = "ollama-general-minimal"
provider = "ollama"
component = "ollama"
role = "general"
tier = "minimal"
default = true
platforms = ["darwin", "linux"]
arches = ["arm64", "x86_64", "aarch64", "amd64"]
min_memory_gb = 8
recommended_memory_gb = 8
estimated_disk_gb = 2.0
ollama_model = "llama3.2:3b"
source = "ollama registry"
description = "Small general chat model for constrained hosts"

[[models]]
id = "ollama-general-balanced"
provider = "ollama"
component = "ollama"
role = "general"
tier = "balanced"
default = true
platforms = ["darwin", "linux"]
arches = ["arm64", "x86_64", "aarch64", "amd64"]
min_memory_gb = 16
recommended_memory_gb = 16
estimated_disk_gb = 4.7
ollama_model = "qwen2.5:7b"
source = "ollama registry"
description = "Balanced general chat (Qwen2.5 7B)"

[[models]]
id = "ollama-general-large"
provider = "ollama"
component = "ollama"
role = "general"
tier = "large"
default = true
platforms = ["darwin", "linux"]
arches = ["arm64", "x86_64", "aarch64", "amd64"]
min_memory_gb = 32
recommended_memory_gb = 32
estimated_disk_gb = 9.0
ollama_model = "qwen2.5:14b"
source = "ollama registry"
description = "Larger general chat for 32GB+ hosts"

[[models]]
id = "ollama-general-max"
provider = "ollama"
component = "ollama"
role = "general"
tier = "max"
default = true
platforms = ["darwin", "linux"]
arches = ["arm64", "x86_64", "aarch64", "amd64"]
