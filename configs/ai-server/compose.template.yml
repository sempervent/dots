# Generated by DOTS — do not edit. Source: configs/ai-server/compose.template.yml
name: dots-ai-server

services:
  llama:
    image: ${LLAMA_IMAGE}
    restart: unless-stopped
    networks: [ai_internal]
    expose:
      - "${LLAMA_PORT}"
    volumes:
      - ${MODELS_DIR}:/models:ro
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "${LLAMA_PORT}"
      - -m
      - /models/${DEFAULT_MODEL}
      - -c
      - "${CONTEXT_SIZE}"
      - -t
      - "${THREADS}"
      - -np
      - "${PARALLEL}"
      - -ngl
      - "${GPU_LAYERS}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:${LLAMA_PORT}/health >/dev/null 2>&1 || wget -q -O - http://127.0.0.1:${LLAMA_PORT}/v1/models >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  open-webui:
    image: ${WEBUI_IMAGE}
    restart: unless-stopped
    networks: [ai_internal]
    ports:
      - "${WEBUI_HOST_PORT}:${WEBUI_CONTAINER_PORT}"
    environment:
      OPENAI_API_BASE_URL: http://llama:${LLAMA_PORT}/v1
      OPENAI_API_KEY: local-dots
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
    volumes:
      - ${WEBUI_DATA_DIR}:/app/backend/data
    depends_on:
      llama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:${WEBUI_CONTAINER_PORT}/health >/dev/null 2>&1 || wget -q -O - http://127.0.0.1:${WEBUI_CONTAINER_PORT}/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

networks:
  ai_internal:
    driver: bridge
