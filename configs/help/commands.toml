# configs/help/commands.toml — authoritative DOTS CLI command metadata
#
# Drives: ./dots --help synopsis, dots-help TUI, man pages, docs generation.
# Keep in sync with the `dots` dispatcher (scripts/tests enforce drift).

version = 1

[[commands]]
name = "setup"
usage = "dots setup [options]"
category = "lifecycle"
description = "Interactive or noninteractive setup / reconfigure toward desired state."
mutating = true
related = ["status", "check", "update", "help"]
[[commands.examples]]
command = "dots setup"
description = "Interactive wizard."
[[commands.examples]]
command = "dots setup --dry-run"
description = "Preview without mutating."

[[commands]]
name = "status"
usage = "dots status"
category = "diagnostics"
description = "Show current DOTS state (profile, packages summary, components)."
mutating = false
related = ["check", "packages", "components", "help"]
[[commands.examples]]
command = "dots status"
description = "Read-only machine dashboard."

[[commands]]
name = "components"
usage = "dots components [list|active|show ID]"
category = "components"
description = "Inspect optional components and --with selectors."
mutating = false
related = ["setup", "packages", "help"]
[[commands.examples]]
command = "dots components list"
description = "Registry + host compatibility."
[[commands.examples]]
command = "dots components active"
description = "Last-selected components (informational)."

[[commands]]
name = "lsp"
usage = "dots lsp [status|check|install|list]"
category = "developer_tooling"
description = "Language-server install, status, and checks."
mutating = false
related = ["setup", "check", "help"]
[[commands.examples]]
command = "dots lsp status"
description = "Show selected/installed language servers."

[[commands]]
name = "ai"
usage = "dots ai [status|doctor|up|down|…]"
category = "ai"
description = "AI inference server (Compose + Open WebUI) control plane."
mutating = true
related = ["models", "setup", "help", "agent"]
[[commands.examples]]
command = "dots ai status"
description = "Show AI server stack status."

[[commands]]
name = "agent"
usage = "dots agent [status|doctor|sandbox|models|scout|eval|team|run|…]"
category = "ai"
description = "Local-first agent harness (Pi, OpenRig, evals, guarded autonomy)."
mutating = true
related = ["ai", "models", "setup", "help"]
[[commands.examples]]
command = "dots agent status"
description = "Show local executor, gateway, sandbox, autonomy, and budget policy."
[[commands.examples]]
command = "dots agent doctor"
description = "Read-only harness diagnostics including sandbox FAIL/WARN/OK."
[[commands.examples]]
command = "dots agent sandbox status"
description = "Sandbox provider, OS backends, and MCP allowlist."
[[commands.examples]]
command = "dots agent scout --task debugging --language rust --tools --quality strong"
description = "Select model by expected cost-to-success when empirical evidence exists."
[[commands.examples]]
command = "dots agent route --task debugging --language python --quality strong --simulate"
description = "Inspect evidence-based routing without inference."
[[commands.examples]]
command = "dots agent eval list"
description = "List deterministic eval tasks."
[[commands.examples]]
command = "dots agent eval run --local --suite smoke"
description = "Run smoke evals against the configured local model (oracle/mock in CI)."
[[commands.examples]]
command = "dots agent eval results"
description = "Summarize empirical pass rates with Wilson lower bounds."
[[commands.examples]]
command = "dots agent team up dots-triad --project . --dry-run"
description = "Plan an OpenRig triad (no mutation)."
[[commands.examples]]
command = "dots agent team status"
description = "OpenRig daemon/terminal/budget/policy status."
[[commands.examples]]
command = "dots agent run --task-class debugging \"Diagnose and fix the failing test.\""
description = "Safe sandboxed run (default); use --unsafe-host to bypass."
[[commands.examples]]
command = "dots agent failures"
description = "List structural failure fingerprints from local ledgers."
[[commands.examples]]
command = "dots agent metrics"
description = "Aggregate local run/outcome/recovery metrics."
[[commands.examples]]
command = "dots agent replay RUN_ID"
description = "Offline policy replay (zero network, mutations, or billable calls)."
[[commands.examples]]
command = "dots agent worktrees"
description = "List isolated agent worktrees."
[[commands.examples]]
command = "dots agent mcp status"
description = "Trusted MCP allowlist for safe runs."
[[commands.examples]]
command = "dots agent costs"
description = "Show DOTS-recorded spend from the local ledger."

[[commands]]
name = "packages"
usage = "dots packages [groups|group|plan|status|explain|outdated|upgrade|adopt]"
category = "packages"
description = "Package ownership, drift, groups, and upgrades."
mutating = false
related = ["status", "check", "setup", "help"]
[[commands.examples]]
command = "dots packages groups"
description = "List capability groups."
[[commands.examples]]
command = "dots packages status"
description = "Full package ownership audit."
[[commands.examples]]
command = "dots packages explain bat"
description = "Explain one package's ownership state."

[[commands]]
name = "backup"
usage = "dots backup [--name N]"
category = "recovery"
description = "Snapshot managed targets under ~/.local/state/dots/backups/."
mutating = true
related = ["backups", "restore", "help"]
[[commands.examples]]
command = "dots backup --name before-change"
description = "Named pre-change snapshot."

[[commands]]
name = "backups"
usage = "dots backups"
category = "recovery"
description = "List recoverable DOTS snapshots."
mutating = false
related = ["backup", "restore", "help"]

[[commands]]
name = "restore"
usage = "dots restore [ID]"
category = "recovery"
description = "Restore a snapshot (creates a safety snapshot first)."
mutating = true
related = ["backup", "backups", "help"]

[[commands]]
name = "profile"
usage = "dots profile …"
category = "lifecycle"
description = "Create, preview, or switch machine profiles."
mutating = true
related = ["setup", "status", "help"]

[[commands]]
name = "models"
usage = "dots models [discover|pull|…]"
category = "ai"
description = "Local model plan, discovery, and pull workflows."
mutating = false
related = ["ai", "setup", "help"]
[[commands.examples]]
command = "dots models discover"
description = "Read-only inventory (no downloads)."

[[commands]]
name = "check"
usage = "dots check [--profile NAME] | dots check fast|workflows|docs|all-local|act|release-notes|security|containers|k8s|dev|data|backup|network|hardware|infra"
category = "diagnostics"
description = "Machine health plus local CI, docs, security, containers, k8s, data, backup, network, hardware, and infra checks."
mutating = false
related = ["status", "update", "help", "packages"]
[[commands.examples]]
command = "dots check"
description = "Profile-aware machine health."
[[commands.examples]]
command = "dots check fast"
description = "Cheap local CI validators (requires package group dev)."
[[commands.examples]]
command = "dots check workflows"
description = "actionlint + zizmor on GitHub Actions."
[[commands.examples]]
command = "dots check docs --offline"
description = "Docs lint + Vale + links + diagrams without external HTTP."
[[commands.examples]]
command = "dots check docs status"
description = "Documentation tooling inventory (Graphviz/Pandoc/Vale/Mermaid/Typst)."
[[commands.examples]]
command = "dots check docs render"
description = "Non-mutating diagram/doc previews to a temp directory."
[[commands.examples]]
command = "dots check release-notes"
description = "Preview git-cliff notes since previous tag (stdout)."
[[commands.examples]]
command = "dots check security"
description = "Secrets/source/deps/SBOM gate (requires package group security)."
[[commands.examples]]
command = "dots check security status"
description = "SOPS/age/YubiKey/osquery/step capability report (non-mutating)."
[[commands.examples]]
command = "dots check containers"
description = "OCI CLIs + static Dockerfile/Compose checks (no runtime start)."
[[commands.examples]]
command = "dots check k8s status"
description = "Kubernetes tooling vs cluster connectivity (cluster optional)."
[[commands.examples]]
command = "dots check dev"
description = "Developer tooling presence (jj/git-town/ast-grep/lnav/API tools)."
[[commands.examples]]
command = "dots check dev repo"
description = "Optional read-only git-sizer report for this repository."
[[commands.examples]]
command = "dots check data"
description = "PostgreSQL/tabular tooling presence (no DB connections or dataset reads)."
[[commands.examples]]
command = "dots check data examples"
description = "Print data-tool example commands (stdout only; not executed)."
[[commands.examples]]
command = "dots check backup"
description = "Backup/sync tooling presence (no repo init, remotes, or Syncthing start)."
[[commands.examples]]
command = "dots check backup examples"
description = "Print recovery-oriented example commands (stdout only; not executed)."
[[commands.examples]]
command = "dots check network"
description = "Network tooling presence (no scans, captures, or Tailscale up)."
[[commands.examples]]
command = "dots check network examples"
description = "Print network-tool example commands (stdout only; not executed)."
[[commands.examples]]
command = "dots check hardware"
description = "Hardware tooling presence (no SMART tests, fio workloads, or serial I/O)."
[[commands.examples]]
command = "dots check hardware examples"
description = "Print hardware-tool example commands (stdout only; not executed)."
[[commands.examples]]
command = "dots check infra"
description = "Infrastructure tooling presence (no apply/login/build)."
[[commands.examples]]
command = "dots check infra gate"
description = "Static IaC format/lint on fixtures (no init/backends/network APIs)."
[[commands.examples]]
command = "dots check infra examples"
description = "Print infra-tool example commands (stdout only; not executed)."

[[commands]]
name = "update"
usage = "dots update"
category = "lifecycle"
description = "git pull the DOTS repo and optionally reapply setup."
mutating = true
related = ["setup", "check", "help"]

[[commands]]
name = "help"
usage = "dots help [topic] [--plain] [--search QUERY] [--cheatsheet]"
category = "discovery"
description = "Interactive Textual help (dots-help) for this machine."
mutating = false
related = ["status", "check", "shell", "completion"]
[[commands.examples]]
command = "dots help"
description = "Open the interactive help TUI."
[[commands.examples]]
command = "dots help completion"
description = "Jump to fuzzy completion topic."
[[commands.examples]]
command = "dots help --plain packages"
description = "Plain-text packages topic."
[[commands.examples]]
command = "dots help --cheatsheet"
description = "Machine-specific cheat sheet."

[[commands]]
name = "shell"
usage = "dots shell [status|keys|startup]"
category = "diagnostics"
description = "Inspect shell, prompt, and keybinding ownership."
mutating = false
related = ["completion", "status", "help", "check"]
[[commands.examples]]
command = "dots shell status"
description = "Who owns Tab / Ctrl-R / prompt."
[[commands.examples]]
command = "dots shell keys"
description = "Concise keybinding table for this machine."
[[commands.examples]]
command = "dots shell startup"
description = "Timed interactive shell startup samples."

[[commands]]
name = "completion"
usage = "dots completion [status|paths]"
category = "diagnostics"
description = "DOTS CLI completion and fzf-tab diagnostics."
mutating = false
related = ["shell", "help"]
[[commands.examples]]
command = "dots completion status"
description = "Show completion engine and binding owners."
[[commands.examples]]
command = "dots completion paths"
description = "Show installed completion script paths."
