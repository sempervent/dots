# configs/bootstrap/profiles/all.toml
# Lab convenience: every optional DOTS component (may include cloud AI).

[profile]
name = "all"
description = "ALL optional DOTS components (lab convenience — may include cloud AI)"
include_all_optional = true
with = []
packages = [
  "core", "modern", "workstation", "infra", "media", "gui",
  "dev", "security", "network", "data", "geo",
]
open_apps = ["iTerm"]

[runtime]
multiplexer = "tmux"
greeting = true
prompt_stats = false
