# configs/bootstrap/profiles/home.toml
# EDITABLE home-machine template.

[profile]
name = "home"
description = "Personal workstation — edit before relying on it"
with = [
  "hermes",
  "herdr",
  "ollama",
  "skills",
  "ai-skills",
  "drawthings",
  "opencode",
  "codex",
  "cursor",
  "images",
  "tex",
]
packages = ["core", "modern", "workstation", "infra", "media", "gui"]
open_apps = ["iTerm", "Draw Things", "Cursor"]

[runtime]
multiplexer = "herdr"
greeting = true
prompt_stats = false
