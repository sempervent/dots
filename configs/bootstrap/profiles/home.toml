# configs/bootstrap/profiles/home.toml
# EDITABLE home-machine template. Adjust `with` to your preferred stack.
#
# Use: ./bootstrap.sh --profile home
# Or edit via: ./configure.sh

[profile]
name = "home"
description = "Personal workstation — edit before relying on it"

with = [
  "hermes",
  "herdr",
  "ollama",
  "skills",
  "ai-skills",
  "drawthings",
  "opencode",
  "codex",
  "cursor",
  "images",
  "tex",
]

open_apps = ["iTerm", "Draw Things", "Cursor"]
