# configs/bootstrap/profiles/home.toml
# Builtin home preset. Prefer ~/.config/dots/profiles/*.toml with extends="home"
# instead of editing this file for machine-specific differences.
#
# Uses the `ai` supergroup for AI applications, then adds non-AI home extras.
# FluidVoice is excluded from home by default (opt in with --with fluidvoice).
# On Darwin this resolves to the same AI apps as the prior leaf list (minus
# FluidVoice). Platform-incompatible AI members are omitted from the group.

[profile]
name = "home"
description = "Personal workstation — edit before relying on it"
with = [
  "ai",
  "herdr",
  "skills",
  "ai-skills",
  "images",
  "tex",
]
without = ["fluidvoice"]
packages = ["core", "modern", "workstation", "infra", "media", "gui"]
open_apps = ["iTerm", "Draw Things", "Cursor"]

[runtime]
multiplexer = "herdr"
greeting = true
prompt_stats = false
