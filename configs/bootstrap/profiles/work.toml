# configs/bootstrap/profiles/work.toml
# Conservative work-machine template.
#
# IMPORTANT: Do NOT infer employer AI policy. Start with NO AI clients.
# Cursor MUST NOT be included without approval.

[profile]
name = "work"
description = "Conservative allowlist — no AI clients by default"
with = []
packages = ["core", "modern", "workstation"]
open_apps = ["iTerm"]

[runtime]
multiplexer = "tmux"
greeting = true
prompt_stats = false
