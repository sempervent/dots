# configs/bootstrap/profiles/work.toml
# Conservative work-machine preset.
#
# Prefer ~/.config/dots/profiles/*.toml with extends="work" for employer-approved
# extras — do not weaken this default by editing the repository preset.
#
# IMPORTANT: Do NOT infer employer AI policy. Start with NO AI clients.
# Cursor MUST NOT be included without approval.
#
# Package groups: +dev +data +security (install-only CLIs). Network/geo omitted
# by default — add via custom profile or --packages if needed.

[profile]
name = "work"
description = "Conservative allowlist — no AI clients by default"
with = []
packages = ["core", "modern", "workstation", "dev", "data", "security"]
open_apps = ["iTerm"]

[runtime]
multiplexer = "tmux"
greeting = true
prompt_stats = false
