# Curated Hermes Engineering Pack (DOTS --with skills)
# Install via skills CLI globally → ~/.agents/skills/
# Hermes discovers via ~/.hermes/skills/ (skills CLI symlink).
#
# Do NOT install the entire magnus919 catalog — only entries below.

version = 1
name = "hermes-engineering-pack"
description = "Curated engineering skills for Hermes (reproducible, security-reviewed)"

[[skills]]
name = "skill-security-review"
source = "dkleptsov/skill-security-review"
group = "security"
enabled = true
# Audit provenance before enabling new third-party skills.

