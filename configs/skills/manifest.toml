# Curated skill packs for DOTS
#
# Install via skills CLI → ~/.agents/skills/
# Hermes discovers via ~/.hermes/skills/ only when hermes is co-selected.
#
# Packs:
#   skills     — engineering pack (--with skills); includes Archify
#   ai-skills  — AI/agent harness pack (--with ai-skills)
#
# Union (--with skills,ai-skills): install each skill once (set semantics).
# Do NOT install the entire magnus919 catalog.

version = 3
name = "dots-skill-packs"
description = "Declarative curated skill packs with groups and provenance"

# Pack → group membership (skills listed under [[skills]] with matching group)
[packs.skills]
description = "Engineering pack (reproducible, security-reviewed)"
groups = ["security", "core", "engineering", "infrastructure", "testing", "visualization"]

[packs.ai-skills]
description = "AI/agent engineering pack for operating and evaluating the harness"
groups = ["security", "ai"]

[packs.frontend-skills]
description = "Optional frontend design and review skills. Not part of the ai supergroup."
groups = ["frontend"]

# Reviewed sources. Install from the pinned ref, not a moving branch.
[[skill_sources]]
id = "cloudflare-security-audit"
repo = "cloudflare/security-audit-skill"
ref = "c1c8a8c1471069fb0e188eeaff69b8e8db6564a8"
reviewed_date = "2026-11-24"
license = "MIT"
bundle = "cloudflare"

[[skill_sources]]
id = "getsentry-skills"
repo = "getsentry/skills"
ref = "a582c51ee29d0f35e6ac321340796f77d43da733"
reviewed_date = "2026-11-24"
license = "Apache-2.0"
bundle = "getsentry"

[[skill_sources]]
id = "huggingface-skills"
repo = "huggingface/skills"
ref = "d67b12054923df5bbfa07c5ff1331412deebdf4f"
reviewed_date = "2026-11-24"
license = "Apache-2.0"
bundle = "huggingface"

[[skill_sources]]
id = "anthropics-skills"
repo = "anthropics/skills"
ref = "e4bb5d960d87126ff3b3a8af1a104b7db67560ba"
reviewed_date = "2026-11-24"
license = "Apache-2.0"
bundle = "anthropic"

[[skill_sources]]
id = "dots-local"
repo = "local"
ref = "dots-v1.14.0"
path = "skills/skill-authoring"
reviewed_date = "2026-11-24"
license = "MIT"
bundle = "dots"

# ---------------------------------------------------------------------------
# security
# ---------------------------------------------------------------------------

[[skills]]
name = "skill-security-review"
source = "dkleptsov/skill-security-review"
group = "security"
enabled = true
# Audit prerequisite before enabling new third-party skills.

