# Curated skill packs for DOTS
#
# Install via skills CLI → ~/.agents/skills/
# Hermes discovers via ~/.hermes/skills/ only when hermes is co-selected.
#
# Packs:
#   skills     — engineering pack (--with skills); includes Archify
#   ai-skills  — AI/agent harness pack (--with ai-skills)
#
# Union (--with skills,ai-skills): install each skill once (set semantics).
# Do NOT install the entire magnus919 catalog.

version = 2
name = "dots-skill-packs"
description = "Declarative curated skill packs with groups and provenance"

# Pack → group membership (skills listed under [[skills]] with matching group)
[packs.skills]
description = "Engineering pack (reproducible, security-reviewed)"
groups = ["security", "core", "engineering", "infrastructure", "testing", "visualization"]

[packs.ai-skills]
description = "AI/agent engineering pack for operating and evaluating the harness"
groups = ["security", "ai"]

# ---------------------------------------------------------------------------
# security
# ---------------------------------------------------------------------------

[[skills]]
name = "skill-security-review"
source = "dkleptsov/skill-security-review"
group = "security"
enabled = true
# Audit prerequisite before enabling new third-party skills.

