# DOTS Starship — same three-line box contract as bash/prompt.sh
# Deployed to ~/.config/starship.toml
#
# ┌──┤user@host├─┤HH:MM:SS├─┤Day Mon DD├─┤upstream->branch│
# ├───┤jobs (N)├─┤venv│
# └─┤~/path│

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[┌──┤](fg:overlay1)\
$username\
[@](fg:overlay1)\
$hostname\
[├─┤](fg:overlay1)\
$time\
[├─┤](fg:overlay1)\
${custom.date}\
${custom.git_relation}\
[│](fg:overlay1)$line_break\
[├───┤](fg:overlay1)\
$jobs\
${custom.venv}\
[│](fg:overlay1)$line_break\
[└─┤](fg:overlay1)\
$directory\
[│ ](fg:overlay1)\
"""

add_newline = true
palette = "catppuccin_mocha"
command_timeout = 500

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[username]
show_always = true
style_user = "fg:green"
style_root = "bold fg:red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "fg:blue"
format = "[$hostname]($style)"
disabled = false

[time]
disabled = false
time_format = "%H:%M:%S"
style = "fg:mauve"
format = "[$time]($style)"

[custom.date]
command = "date '+%a %b %d' | sed 's/ 0\\([0-9]\\)/ \\1/'"
when = "true"
shell = ["bash", "--noprofile", "--norc"]
style = "fg:teal"
format = "[$output]($style)"

# Emits "├─┤relation" or empty (omits empty git segment entirely)
[custom.git_relation]
command = """
if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then exit 0; fi
branch=$(git symbolic-ref -q --short HEAD 2>/dev/null || true)
if [ -z "$branch" ]; then
  short=$(git rev-parse --short HEAD 2>/dev/null || true)
  [ -n "$short" ] && printf '├─┤detached@%s' "$short"
  exit 0
fi
head_ref=$(git symbolic-ref -q HEAD 2>/dev/null || true)
remote=""
[ -n "$head_ref" ] && remote=$(git for-each-ref --format='%(upstream:short)' "$head_ref" 2>/dev/null || true)
if [ -n "$remote" ]; then rel="${remote}->${branch}"; else rel="$branch"; fi
marks=""
if ! git diff --quiet --ignore-submodules HEAD 2>/dev/null \
  || ! git diff --cached --quiet --ignore-submodules 2>/dev/null \
  || [ -n "$(git ls-files --others --exclude-standard 2>/dev/null | head -1)" ]; then
  marks="!"
fi
ab=$(git rev-list --left-right --count '@{upstream}...HEAD' 2>/dev/null || true)
if [ -n "$ab" ]; then
  behind=${ab%%$'\t'*}; ahead=${ab##*$'\t'}
  [ "${ahead:-0}" -gt 0 ] 2>/dev/null && marks="${marks}↑${ahead}"
  [ "${behind:-0}" -gt 0 ] 2>/dev/null && marks="${marks}↓${behind}"
fi
if [ -n "$marks" ]; then printf '├─┤%s %s' "$rel" "$marks"; else printf '├─┤%s' "$rel"; fi
"""
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1"
shell = ["bash", "--noprofile", "--norc"]
style = "fg:yellow"
format = "[$output]($style)"
ignore_timeout = true

[jobs]
disabled = false
symbol_threshold = 0
number_threshold = 0
style = "fg:teal"
format = "[jobs ($number)]($style)"

[custom.venv]
command = 'basename "$VIRTUAL_ENV"'
when = 'test -n "$VIRTUAL_ENV"'
shell = ["bash", "--noprofile", "--norc"]
style = "fg:overlay2"
format = "[├─┤$output]($style)"

[directory]
style = "fg:yellow"
truncation_length = 8
truncate_to_repo = false
fish_style_pwd_dir_length = 1
format = "[$path]($style)"
truncation_symbol = "…/"

# Disabled modules that previously belonged to the Powerline layout
[os]
disabled = true

[git_branch]
disabled = true

[git_status]
disabled = true

[python]
disabled = true

[nodejs]
disabled = true

[kubernetes]
disabled = true

[cmd_duration]
disabled = true

[status]
disabled = true

[character]
disabled = true
