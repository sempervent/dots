# Conservative local quality floors for OpenRouter model families.
# OpenRouter metadata cannot prove "can solve this bug" — this registry
# only supplies coarse qualitative tiers for selection filtering.
#
# Unknown models do NOT inherit "strong". They may appear as unrated
# candidates but cannot win an automatic quality_floor=strong selection.
#
# Provenance is required on every rule. Prefer vendor/OpenRouter evidence.

version = 1

[[families]]
# Pattern matched against OpenRouter model id (provider/model), case-insensitive
id_pattern = "anthropic/claude-opus"
quality = "frontier"
task_classes = ["general", "coding", "debugging", "architecture", "reasoning", "tool_use"]
source = "https://openrouter.ai/anthropic/claude-opus-4.1"
reviewed_date = "2026-11-03"
notes = "Frontier coding/reasoning family; treat as expensive expert."

[[families]]
id_pattern = "anthropic/claude-sonnet"
quality = "strong"
task_classes = ["general", "coding", "debugging", "architecture", "reasoning", "tool_use"]
source = "https://openrouter.ai/anthropic/claude-sonnet-4"
reviewed_date = "2026-11-03"
notes = "Strong general coding/debug quality floor."

