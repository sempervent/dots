# DOTS agent evaluation registry (Phase 3).
# Deterministic scorers only — no LLM-as-judge primary path.
version = 1
schema_version = 1

# ── coding ──────────────────────────────────────────────────────────────

[[tasks]]
id = "python-add-function"
class = "coding"
language = "python"
difficulty = "basic"
timeout_seconds = 60
max_output_tokens = 1500
sandbox = true
suite = ["smoke", "standard", "full"]
fixture = "coding/python-add-function"
prompt = """
Implement add(a, b) in solution.py so the tests pass. Do not modify the tests.
"""
prerequisites = ["python3"]
[tasks.scorer]
type = "command"
command = ["python3", "-m", "pytest", "-q", "tests"]
[tasks.expected]
exit_code = 0

