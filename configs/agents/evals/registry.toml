Write answer.json with object {"name":"Ada","age":36} exactly.
"""
[tasks.scorer]
type = "json_schema"
path = "answer.json"
schema = { type = "object", required = ["name", "age"], properties = { name = { type = "string" }, age = { type = "integer" } }, additionalProperties = false }
