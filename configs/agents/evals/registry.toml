# ── reasoning ───────────────────────────────────────────────────────────

[[tasks]]
id = "dependency-order"
class = "reasoning"
language = ""
difficulty = "basic"
timeout_seconds = 30
max_output_tokens = 400
sandbox = false
suite = ["smoke", "standard", "full"]
fixture = "reasoning/dependency-order"
prompt = """
Packages: A depends on B; B depends on C; D depends on A.
Return the unique install order as a JSON array of package names (deps first).
Write ONLY the JSON array to answer.json.
"""
[tasks.scorer]
type = "json_exact"
path = "answer.json"
[tasks.expected]
equals = ["C", "B", "A", "D"]

[[tasks]]
id = "config-precedence"
class = "reasoning"
language = ""
difficulty = "basic"
timeout_seconds = 30
max_output_tokens = 400
sandbox = false
suite = ["standard", "full"]
fixture = "reasoning/config-precedence"
prompt = """
Defaults: mode=safe. User override: mode=in_place. CLI: mode=unsafe_host.
CLI wins over user over defaults. Write the effective mode as JSON string to answer.json.
"""
[tasks.scorer]
type = "json_exact"
path = "answer.json"
[tasks.expected]
equals = "unsafe_host"

[[tasks]]
id = "state-machine"
class = "reasoning"
language = ""
difficulty = "capable"
timeout_seconds = 30
max_output_tokens = 400
sandbox = false
suite = ["standard", "full"]
fixture = "reasoning/state-machine"
prompt = """
States: idle -> running on start; running -> idle on stop; running -> failed on error;
failed -> idle on reset. Start in idle. Events: start, error, reset.
Write final state as JSON string to answer.json.
"""
[tasks.scorer]
type = "json_exact"
path = "answer.json"
[tasks.expected]
equals = "idle"

[[tasks]]
id = "topo-layers"
class = "reasoning"
language = ""
difficulty = "capable"
timeout_seconds = 30
max_output_tokens = 500
sandbox = false
suite = ["full"]
fixture = "reasoning/topo-layers"
prompt = """
Edges: 1->2, 1->3, 2->4, 3->4. Return JSON object {"layers": [[...], ...]}
where each layer is a sorted list of nodes that can run in parallel (Kahn layers).
Write to answer.json.
"""
[tasks.scorer]
type = "json_exact"
path = "answer.json"
[tasks.expected]
equals = { layers = [["1"], ["2", "3"], ["4"]] }

