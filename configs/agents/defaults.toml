# DOTS agent harness defaults (v1.6 Phase 3).
# Live override (optional): ~/.config/dots/agents.toml
# Repo template: configs/agents/defaults.toml
#
# Selecting `pi` alone does NOT authorize OpenRouter.
# Selecting `litellm` alone does NOT modify Pi.
# Selecting `agent-sandbox` configures the security boundary (provider: pi-sandbox).

version = 1

[agent]
mode = "auto"
# Execution: safe (default) | in_place | unsafe_host
execution_mode = "safe"
session_budget_usd = 1.00
max_remote_calls = 3
max_iterations = 25
timeout_seconds = 1800
# Per-call interactive approval threshold
approval_threshold_usd = 0.50
# Live smoke hard cap (DOTS_AGENT_LIVE_TEST=1)
live_test_max_usd = 0.05
# Noninteractive permission prompts: fail closed quickly (seconds). 0 = Pi default.
permission_prompt_timeout_seconds = 5

[local]
provider = "auto" # auto | llamacpp | ollama
model = "auto"
# Used when provider resolves to llama.cpp OpenAI-compatible router
llamacpp_base_url = "http://127.0.0.1:8080/v1"
ollama_base_url = "http://127.0.0.1:11434"

[gateway]
base_url = "http://127.0.0.1:4000"
# Logical aliases configured in services/litellm/config.yaml
local_alias = "dots/local"
remote_prefix = "openrouter/"

[scout]
catalog_cache_ttl_seconds = 900
max_candidates = 5
# Official OpenRouter account-filtered catalog (authenticated)
catalog_url = "https://openrouter.ai/api/v1/models/user"
# Public fallback when no API key (read-only list; may differ from account)
catalog_url_public = "https://openrouter.ai/api/v1/models"
provider_sort = "price"

[escalation]
local_attempts_before_suggested_escalation = 2
# Compact context only — never dump the whole repo
max_context_chars = 24000

[mcp]
model_scout_name = "dots-model-scout"
expert_name = "dots-expert"
# Safe harness allowlist only — interactive `pi` keeps the user's full MCP config.
safe_servers = ["dots-model-scout", "dots-expert"]

[sandbox]
provider = "pi-sandbox"
# Fail closed when safe/in_place cannot initialize the sandbox.
fail_closed = true
worktree_enabled = true
# Bash external network: only localhost by default (model/MCP network is separate).
bash_allowed_domains = ["localhost", "127.0.0.1"]
# Noninteractive: never enable agent access-request tools that could escalate.
enable_access_request_tool = false

[paths]
# Relative to XDG; expanded at runtime
cache_dir = "dots/agents"
state_dir = "dots/agents"
worktrees_dir = "dots/agents/worktrees"
runtime_dir = "dots/agents/runtime"
# Pi MCP merge targets (user-level; never wholesale overwrite)
pi_mcp_json = "~/.pi/agent/mcp.json"
pi_settings_json = "~/.pi/agent/settings.json"
pi_sandbox_json = "~/.pi/agent/sandbox.json"

[routing]
# Policy version recorded with every auto-route decision
policy_version = 1
# Preference: economy (expected-cost primary) | balanced (slight latency weight)
preference = "economy"

[routing.quality]
# Minimum conservative success probability by qualitative floor
basic = 0.40
capable = 0.60
strong = 0.80
frontier = 0.90

[routing.evidence]
minimum_attempts = 5
max_age_days = 90
# Wilson score interval z for ~95% confidence
wilson_z = 1.96

[evals]
schema_version = 1
registry = "configs/agents/evals/registry.toml"
default_suite = "standard"
default_local_runs = 3
default_remote_runs = 1
# Smoke suites keep wall time low
smoke_tasks_per_class = 1

[policy]
# Shown to the local Pi foreman
system_prompt_path = "configs/agents/local-foreman.md"
