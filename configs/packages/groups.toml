# configs/packages/groups.toml — logical package groups with explicit required/optional
#
# required: must be present after install for the profile contract (ERROR if missing)
# optional: nice-to-have; WARN if missing; may be SKIP on some package managers
# Platform maps (apt/pacman/…) translate ids → native names; empty = cannot install via mgr

version = 1

[[groups]]
name = "core"
description = "Portable essentials"
required = [
  "bash", "zsh", "tmux", "git", "curl", "wget", "jq",
  "ripgrep", "fd", "fzf", "neovim", "rsync",
]
optional = [
  "shellcheck", "fnm", "starship",
]

[[groups]]
name = "modern"
description = "Shared ergonomic CLI + Git evolution / structural search / log inspection"
required = [
  "bat", "zoxide", "direnv", "htop", "tree",
]
optional = [
  "eza", "atuin", "lazygit", "btop", "yq", "uv", "gh", "just",
  "git-delta", "leaf",
  # v1.7 Phase 4 — Git evolution / search / logs (install-only; no Git takeover)
  "jj", "git-town", "git-filter-repo", "git-sizer", "ast-grep", "lnav",
]

[[groups]]
name = "workstation"
description = "Desktop-user tools (not headless)"
required = [
  "ranger",
]
optional = [
  "terminal-notifier", "chafa", "poppler",
]

[[groups]]
name = "infra"
description = "Docker CLI / Helm / Terraform (k8s operator CLIs live in group k8s)"
required = []
optional = [
  "docker", "docker-compose", "helm", "terraform",
]

[[groups]]
name = "media"
description = "Image / video processing"
required = []
optional = [
  "ffmpeg", "imagemagick", "exiftool",
]

[[groups]]
name = "gui"
description = "macOS GUI / fonts"
required = [
  "font-jetbrains-mono-nerd-font",
]
optional = []

[[groups]]
name = "server"
description = "Headless extras"
required = [
  "htop",
]
optional = []

[[groups]]
name = "dev"
description = "Local CI / lint / docs validation / Rust ergonomics (install-only; no shell aliases)"
required = []
optional = [
  "act", "difftastic", "mergiraf", "actionlint", "cargo-nextest", "bacon",
  "pre-commit", "hadolint", "taplo", "mkcert", "kondo",
  # v1.7 Phase 1 — local workflow / docs / release-note validators
  "zizmor", "git-cliff", "lychee", "markdownlint-cli2", "cspell",
]

[[groups]]
name = "security"
description = "Secrets / SBOM / signing / YubiKey / host-inspection CLIs (install-only; no auth or enrollment)"
required = []
optional = [
  "gitleaks", "trivy", "sops", "age", "syft", "grype", "cosign",
  "osv-scanner", "semgrep",
  # v1.7 Phase 2 — YubiKey / PKI / host inventory (install-only; no key gen or enrollment)
  "ykman", "age-plugin-yubikey", "step", "osquery",
]

[[groups]]
name = "network"
description = "Network / remote CLIs (install-only; no Tailscale up; k8s context CLIs live in group k8s)"
required = []
optional = [
  "tailscale", "mosh", "rclone", "bandwhich", "gping", "doggo",
  "grpcurl", "websocat",
]

[[groups]]
name = "data"
description = "PostgreSQL inspection + tabular / analytical CLIs (install-only; no DB connections)"
required = []
optional = [
  "duckdb", "qsv", "visidata", "miller", "jless",
  # v1.7 Phase 5 — PostgreSQL inspection (no credentials / no connections)
  "pgcli", "pg_activity",
]

[[groups]]
name = "backup"
description = "Backup / recovery CLIs (install-only; no repo init, backup, restore, or sync daemon)"
required = []
optional = [
  "restic",
  # rclone remains owned by network; Syncthing is --with syncthing (omit_from_all)
]

[[groups]]
name = "geo"
description = "Geospatial CLI tooling"
required = []
optional = [
  "gdal", "tippecanoe", "pmtiles",
]

[[groups]]
name = "containers"
description = "OCI / container operator CLIs (install-only; no runtime start, pull, or compose up)"
required = []
optional = [
  "lazydocker", "dive", "skopeo", "crane", "oras", "devcontainer", "dagger",
]

[[groups]]
name = "k8s"
description = "Kubernetes / GitOps operator CLIs (install-only; no cluster create, context switch, or deploy)"
required = []
optional = [
  # foundation
  "kubernetes-cli", "k9s", "kubectx", "stern",
  # schema / security / plugins
  "krew", "kubeconform", "kubescape", "popeye",
  # GitOps
  "helmfile", "argocd",
]
