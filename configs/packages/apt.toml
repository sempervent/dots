fzf = "fzf"
shellcheck = "shellcheck"
neovim = "neovim"
rsync = "rsync"
eza = "eza"
bat = "bat"
zoxide = "zoxide"
direnv = "direnv"
htop = "htop"
btop = "btop"
yq = "yq"
gh = "gh"
tree = "tree"
lazygit = "lazygit"
ranger = "ranger"
chafa = "chafa"
poppler = "poppler-utils"
ffmpeg = "ffmpeg"
imagemagick = "imagemagick"
exiftool = "libimage-exiftool-perl"
docker = "docker.io"
docker-compose = "docker-compose-v2"
