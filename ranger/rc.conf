# Minimal Ranger overrides (upstream defaults already load).
# Intentionally small — not a full upstream dump.

set preview_script ~/.config/ranger/scope.sh
set use_preview_script true
set preview_files true
set preview_directories true
set preview_images true
# chafa-friendly textual previews; avoid relying on w3mimg inside tmux/SSH
set preview_images_method w3m
set preview_max_size 10485760
set wrap_plaintext_previews false

set vcs_aware true
set vcs_backend_git local
set automatically_count_files true
set confirm_on_delete multiple
set show_hidden false
set tilde_in_titlebar true
set update_tmux_title true
set sort natural
set sort_directories_first true
set mouse_enabled true
set draw_borders both

set colorscheme catppuccin

# Open with OS handler
map <C-o> shell open "%s" 2>/dev/null || xdg-open "%s" 2>/dev/null || echo "no open helper"

# Fuzzy find (fd/fzf) — explicit, non-colliding
map <C-f> console fzf_select%space
map <C-g> console fzf_content%space
map gz shell zoxide query -i | tr -d '\n' | xargs -r -I{} ranger --selectfile="{}" 2>/dev/null || true

# Safe trash (explicit) — preserves Ranger's normal delete
map dt shell -flags u trash "%s" 2>/dev/null || gio trash "%s" 2>/dev/null || echo "trash unavailable; use Ranger delete"
