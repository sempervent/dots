# vim: ft=cfg
# Minimal rifle overrides. Ranger merges with its defaults.
# Prefer macOS open / Linux xdg-open for "open" label.

label open, has open     = open -- "$@"
label open, has xdg-open = xdg-open -- "$@"

# Editors
mime ^text,  label editor = ${VISUAL:-${EDITOR:-vim}} -- "$@"
mime ^text,  label pager  = "$PAGER" -- "$@"
!mime ^text, label editor, ext xml|json|csv|tex|py|rb|js|ts|sh|zsh|bash|yaml|yml|toml|md|conf|cfg = ${VISUAL:-${EDITOR:-vim}} -- "$@"

# Media
mime ^video|audio, has mpv, X, flag f = mpv -- "$@"
mime ^video|audio, terminal, has mpv = mpv -- "$@"
mime ^image, has open, X, flag f = open "$@"
mime ^image, has feh, X, flag f = feh -- "$@"
