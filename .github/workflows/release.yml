name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name == 'v1.3.0' && 'DOTS v1.3.0 - Prompt, Snapshots, and Skills Reliability' || (github.ref_name == 'v1.2.1' && 'DOTS v1.2.1 - Setup Reliability Fixes' || format('DOTS {0}', github.ref_name)) }}
          generate_release_notes: false
          body: |
            ## Unified DOTS prompt

            Bash and Starship now share the classic three-line DOTS prompt:

            ```text
            ┌──┤user@host├─┤time├─┤date├─┤upstream->branch│
            ├───┤jobs (0)├─┤virtualenv│
            └─┤working/directory│
            ```

            ## Snapshot backup and restore

            Before replacing existing user dotfiles, DOTS creates coherent
            recoverable snapshots under `~/.local/state/dots/backups/`.

            ```bash
            ./dots backups
            ./dots restore
            ```

            Legacy `~/.old_dots` remains readable via `./dots backup import-legacy`.

            ## Skills reliability

            Skills installed directly into supported agent destinations such as
            `~/.hermes/skills` are correctly verified and security-reviewed.
            Verification follows the actual install path, not a hard-coded
            `~/.agents/skills` assumption.
