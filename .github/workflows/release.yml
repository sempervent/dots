name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name == 'v1.2.1' && 'DOTS v1.2.1 - Setup Reliability Fixes' || format('DOTS {0}', github.ref_name) }}
          generate_release_notes: false
          body: |
            ## Existing macOS applications

            DOTS now recognizes compatible GUI applications that already exist in
            `/Applications` even when they were not originally installed through
            Homebrew.

            This prevents setup failures such as a pre-existing Hermes.app
            conflicting with the `hermes-desktop` cask.

            DOTS does not overwrite externally installed apps merely to take
            package-manager ownership.

            ## Transactional profile activation

            A new profile is no longer marked active before setup successfully
            completes. If setup fails, the prior active profile/runtime policy
            remains intact.

            ## Better failure reporting

            Optional-component failures now identify the component that failed
            rather than ending only with a generic aggregate error.

            ## Recovery

            Install operations remain idempotent. Users who encountered the
            v1.2.0 Hermes Desktop conflict can upgrade and rerun `./dots`.
