name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Ubuntu test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare runner
        run: ./scripts/ci/prepare_runner.sh
      - name: Lint
        run: ./scripts/ci/lint.sh
      - name: Test
        run: ./scripts/ci/test.sh

  linux-distros:
    name: Distro smoke (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - "ubuntu:24.04"
          - "archlinux:latest"
          - "ghcr.io/void-linux/void-glibc:latest"
    steps:
      - uses: actions/checkout@v7
      - name: Distro smoke (${{ matrix.image }})
        run: ./scripts/ci/distro_smoke.sh "${{ matrix.image }}"

  macos-smoke:
    name: macOS smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: macOS smoke
        run: ./scripts/ci/macos_smoke.sh
