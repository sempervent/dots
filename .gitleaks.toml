# DOTS gitleaks — repository-scoped secret scanning
# Allowlists are narrow and documented. Prefer fixing leaks over suppression.

title = "DOTS"

[extend]
useDefault = true

[allowlist]
description = "Synthetic fixtures and documented examples only"
paths = [
  '''scripts/tests/fixtures/security/''',
  '''.*/fixtures/security/.*''',
]
regexes = [
  # Documented placeholder in security docs / help examples
  '''EXAMPLE_SECRET_DO_NOT_USE_[A-Z0-9]+''',
]
