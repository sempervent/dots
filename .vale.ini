# .vale.ini — DOTS prose / terminology policy (Phase 8)
#
# Intentionally conservative: high-value terminology + obvious defects only.
# Spelling remains cspell's job. Do not auto-download remote style packages.
# Never upload source externally. Do not rewrite Markdown during checks.

StylesPath = .vale/styles
MinAlertLevel = error
Vocab = DOTS

# No Packages= — styles are vendor/local under .vale/styles only.

[*.{md,mdx,txt}]
BasedOnStyles = DOTS
