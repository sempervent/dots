[project]
name = "dots-drawthings-mcp"
version = "0.1.0"
description = "DOTS MCP stdio bridge wrapping first-party draw-things-cli"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
package = false
