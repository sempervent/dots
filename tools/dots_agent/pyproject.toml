[project]
name = "dots-agent"
version = "0.1.0"
description = "DOTS local-first agent harness (Pi RPC, model-scout, budgeted expert)"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2,<2",
  "httpx>=0.27,<1",
]

[project.scripts]
dots-agent = "dots_agent.cli:main"
dots-model-scout = "dots_agent.scout.mcp_server:main"
dots-expert = "dots_agent.expert.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dots_agent"]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
