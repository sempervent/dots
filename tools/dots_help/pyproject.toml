[project]
name = "dots-help"
version = "1.7.0"
description = "Interactive DOTS help (Textual TUI) for the current machine"
requires-python = ">=3.11"
dependencies = [
  "textual>=2.0,<4",
]

[project.scripts]
dots-help = "dots_help.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dots_help"]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
